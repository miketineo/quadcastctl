[package]
name = "quadcastctl"
version = "0.2.0"
edition = "2024"
description = "Control HyperX Quadcast S / Quadcast 2 / Quadcast 2S / Duocast RGB lighting"
license = "GPL-2.0-only"

[dependencies]
rusb = "0.9"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
ctrlc = "3.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
